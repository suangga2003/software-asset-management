# Datasource Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/asset_management_db

# Hibernate ORM Configuration (Automatically updates schema during development)
#quarkus.hibernate-orm.database.generation=update
# Disable automatic Hibernate DDL generation
quarkus.hibernate-orm.database.generation=none

# Basic in-memory users for testing RBAC
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.architect=architect123,IT-Architect
quarkus.security.users.embedded.users.viewer=viewer123,Viewer

# Enable Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0.0.0